<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>층간소음 시뮬레이터</title>
    <style>
      :root {
        --panel: rgba(20, 20, 21, 0.94);
        --sunken: #0f0f10;
        --raised: #232325;
        --hair: rgba(237, 237, 237, 0.08);
        --text: #ededed;
        --text-2: #a1a1a6;
        --muted: #85858b;
        --under: #4cc38a;
        --source: #d9a441;
        --over: #e5484d;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --sans:
          'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0b0b;
        font-family: var(--sans);
      }
      #info {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 100;
        box-sizing: border-box;
        width: 320px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 16px;
        color: var(--text);
        font-size: 13px;
        line-height: 20px;
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #info summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 28px;
        cursor: pointer;
        list-style: none;
      }
      #info summary::-webkit-details-marker {
        display: none;
      }
      #info summary::after {
        content: "+";
        color: var(--text-2);
        font-size: 20px;
      }
      #info[open] summary::after {
        content: "−";
      }
      #info h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 24px;
      }
      #info button,
      #info select {
        font: inherit;
      }
      #info :focus-visible {
        outline: 2px solid var(--text-2);
        outline-offset: 2px;
      }
      .hint {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 16px;
      }
      .hint[hidden] {
        display: none;
      }
      .section {
        margin-top: 16px;
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 24px;
        margin-bottom: 4px;
        color: var(--text-2);
        font-size: 12px;
      }

      /* 둘 중 하나 선택 */
      .segmented {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--sunken);
        border: 1px solid var(--hair);
        border-radius: 8px;
      }
      .mode-btn {
        flex: 1;
        height: 28px;
        padding: 0 8px;
        color: var(--text-2);
        font-size: 12px;
        background: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background-color 150ms var(--ease),
          color 150ms var(--ease);
      }
      .mode-btn:hover {
        color: var(--text);
      }
      .mode-btn.active {
        color: var(--text);
        font-weight: 500;
        background: var(--raised);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      /* 소음 프리셋 */
      .preset-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .btn {
        height: 32px;
        padding: 0 8px;
        color: var(--text);
        font-size: 12px;
        background: var(--raised);
        border: 1px solid var(--hair);
        border-radius: 8px;
        cursor: pointer;
        transition:
          background-color 150ms var(--ease),
          border-color 150ms var(--ease),
          transform 150ms var(--ease);
      }
      .btn:hover {
        background: #2c2c2f;
        border-color: rgba(237, 237, 237, 0.16);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:disabled,
      .mode-btn:disabled {
        color: var(--muted);
        cursor: not-allowed;
        opacity: 0.6;
      }
      .btn-quiet {
        color: var(--text-2);
        background: transparent;
      }
      .btn-block {
        width: 100%;
        margin-top: 12px;
      }
      .unit-select {
        height: 24px;
        padding: 0 4px;
        color: var(--text);
        font-size: 12px;
        background: var(--raised);
        border: 1px solid var(--hair);
        border-radius: 6px;
      }
      .unit-select option {
        color: #000;
      }
      .follow-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: var(--text-2);
        cursor: pointer;
      }
      .follow-toggle input {
        margin: 0;
      }

      /* 측정 */
      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .meas-head {
        display: flex;
        justify-content: space-between;
        color: var(--text-2);
        font-size: 12px;
      }
      .meas-meta {
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
      }
      .unit-rows {
        max-height: 32vh;
        overflow-y: auto;
      }
      .unit-row {
        display: grid;
        grid-template-columns: 48px 60px 68px 1fr;
        align-items: baseline;
        column-gap: 4px;
        padding: 6px 0 8px;
        font-size: 12px;
        border-top: 1px solid var(--hair);
      }
      .unit-head {
        padding: 8px 0 4px;
        color: var(--muted);
        font-size: 11px;
        border-top: none;
      }
      .unit-name {
        font-weight: 500;
      }
      .unit-row small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 16px;
      }
      .unit-row.is-over small.count {
        color: var(--over);
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        color: var(--text-2);
      }
      .status::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--muted);
        border-radius: 50%;
      }
      .is-under .status::before {
        background: var(--under);
      }
      .is-source .status::before {
        background: var(--source);
      }
      .is-over .status::before {
        background: var(--over);
      }
      .is-over .status {
        color: var(--text);
      }

      /* 기준선이 표시된 레벨 막대 (0–80 dB) */
      .level {
        position: relative;
        grid-column: 1 / -1;
        height: 2px;
        margin-top: 6px;
        background: var(--hair);
        border-radius: 1px;
      }
      .level::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--level, 0%);
        background: var(--text-2);
        border-radius: 1px;
      }
      .is-over .level::before {
        background: var(--over);
      }
      .level::after {
        content: '';
        position: absolute;
        top: -2px;
        left: var(--limit, 50%);
        width: 1px;
        height: 6px;
        background: var(--text);
      }
      .band-title {
        margin-top: 12px;
        color: var(--text-2);
        font-size: 12px;
      }
      .bands {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }
      .band {
        flex: 1;
        padding: 4px 0;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        background: var(--sunken);
        border-radius: 6px;
      }
      .band span {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      /* lil-gui를 패널 톤에 맞춤 */
      .lil-gui {
        --background-color: #141415;
        --title-background-color: #0f0f10;
        --title-text-color: #ededed;
        --text-color: #a1a1a6;
        --widget-color: #232325;
        --hover-color: #2c2c2f;
        --focus-color: #36363a;
        --number-color: #ededed;
        --string-color: #ededed;
        --font-family: var(--sans);
        --font-family-mono: var(--mono);
        --font-size: 12px;
        --input-font-size: 12px;
        --width: 300px;
        --name-width: 48%;
        --widget-height: 24px;
        --spacing: 4px;
      }
      .lil-gui.root {
        top: 16px;
        right: 16px;
        border: 1px solid var(--hair);
        border-radius: 14px;
        overflow: hidden;
      }
      @media (max-width: 700px) {
        #info {
          top: auto;
          bottom: max(8px, env(safe-area-inset-bottom));
          left: max(8px, env(safe-area-inset-left));
          right: max(8px, env(safe-area-inset-right));
          width: auto;
          max-height: 52vh;
          max-height: 52dvh;
          padding: 10px 12px;
          overscroll-behavior: contain;
        }
        #info summary {
          min-height: 44px;
        }
        #info .btn,
        #info .mode-btn,
        #info .unit-select {
          min-height: 44px;
        }
        #info .unit-select {
          font-size: 16px;
        }
        .section-label:has(.unit-select) {
          height: auto;
          min-height: 44px;
          margin-bottom: 8px;
        }
        .follow-toggle {
          min-height: 44px;
        }
        .follow-toggle input {
          width: 20px;
          height: 20px;
        }
        .unit-rows {
          max-height: none;
        }
        .unit-row {
          grid-template-columns: 44px 58px 64px minmax(0, 1fr);
        }
        .status::before {
          flex-shrink: 0;
        }
        .lil-gui.root {
          top: max(8px, env(safe-area-inset-top));
          right: max(8px, env(safe-area-inset-right));
          width: min(300px, calc(100vw - 16px));
          max-height: 40vh;
          max-height: 40dvh;
          overflow-y: auto;
          overscroll-behavior: contain;
          --widget-height: 36px;
          --input-font-size: 16px;
        }
        .lil-gui.root > .title {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <details id="info" open>
      <summary><h1>층간소음 시뮬레이터</h1></summary>
      <p class="hint">바닥이나 벽을 누르거나 길게 눌러 충격 발생</p>

      <div class="section">
        <div class="section-label">기준 시간대 · Leq / Lmax dB(A)</div>
        <div class="segmented">
          <button id="btn-day" class="mode-btn active">주간</button>
          <button id="btn-night" class="mode-btn">야간</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">
          소음 프리셋
          <select
            id="preset-unit"
            class="unit-select"
            aria-label="프리셋 세대"
          ></select>
        </div>
        <div class="preset-grid">
          <button class="btn" data-preset="walk">걷기</button>
          <button class="btn" data-preset="run">아이 뛰기</button>
          <button class="btn" data-preset="jump">제자리 점프</button>
          <button class="btn" data-preset="hammer">망치질</button>
          <button class="btn" data-preset="drop">물건 낙하</button>
          <button id="btn-stop" class="btn btn-quiet">정지</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">바닥 클릭</div>
        <div class="segmented">
          <button class="mode-btn active" data-interaction="impact">
            직접 타격
          </button>
          <button class="mode-btn" data-interaction="character">
            캐릭터 이동
          </button>
        </div>
        <div id="move-hint" class="hint" hidden>
          클릭한 곳으로 걷기 · Shift+클릭이나 더블클릭은 뛰기 · 다른 세대 바닥을
          누르면 그 세대로 이동
          <label class="follow-toggle">
            <input id="follow-camera" type="checkbox" /> 카메라 따라가기
          </label>
        </div>
      </div>

      <div class="section">
        <div id="leq-result">
          <div class="meas-meta">바닥이나 벽을 누르면 측정 시작</div>
        </div>
        <button id="btn-reset" class="btn btn-quiet btn-block">
          측정 초기화
        </button>
      </div>
    </details>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
