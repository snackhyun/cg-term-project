<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>3D 층간소음 전파 시뮬레이터</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0b0b0b;
        font-family:
          'Pretendard',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        background: rgba(15, 15, 20, 0.85);
        backdrop-filter: blur(8px);
        padding: 16px 20px;
        border-radius: 12px;
        pointer-events: auto;
        border-left: 5px solid #ff4444;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        z-index: 100;
        width: 300px;
      }
      #info h3 {
        margin: 0 0 12px 0;
        font-size: 17px;
        color: #ff6b6b;
      }
      .mode-container {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        background: rgba(255, 255, 255, 0.08);
        padding: 4px;
        border-radius: 8px;
      }
      .mode-btn {
        flex: 1;
        text-align: center;
        padding: 8px 0;
        font-size: 13px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: #aaa;
        transition: all 0.2s ease;
      }
      .mode-btn.active {
        background: #ff4444;
        color: #fff;
        font-weight: bold;
      }
      #leq-result {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
      }
      .status-badge {
        display: inline-block;
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 12px;
      }
      .status-safe {
        background: rgba(0, 255, 136, 0.2);
        color: #00ff88;
        border: 1px solid #00ff88;
      }
      .status-danger {
        background: rgba(255, 68, 68, 0.2);
        color: #ff4444;
        border: 1px solid #ff4444;
      }
      .status-source {
        background: rgba(255, 204, 0, 0.15);
        color: #ffcc00;
        border: 1px solid #ffcc00;
      }

      /* 세대별 측정 결과 한 줄 */
      .unit-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .unit-row .status-badge {
        margin-top: 0;
        margin-left: auto;
      }
      .unit-name {
        width: 44px;
        font-weight: bold;
      }
      .unit-leq {
        color: #ffcc00;
        font-weight: bold;
        min-width: 64px;
      }
      .hint {
        color: #888;
        font-size: 12px;
        margin: -4px 0 12px 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h3>🏢 3D 층간소음 시뮬레이터</h3>
      <div class="hint">
        세대 바닥을 길게 누를수록 충격 소음이 커집니다.<br />윗집에서 소음을
        내고 아랫집 수치를 확인해 보세요.
      </div>

      <!-- 주간 / 야간 버튼 선택기 -->
      <div class="mode-container">
        <button
          id="btn-day"
          class="mode-btn active"
          onclick="window.switchMode(false)"
        >
          ☀️ 주간 (39dB)
        </button>
        <button
          id="btn-night"
          class="mode-btn"
          onclick="window.switchMode(true)"
        >
          🌙 야간 (34dB)
        </button>
      </div>

      <!-- 실시간 1분 등가소음도(Leq) 모니터링 모듈 -->
      <div id="leq-result">
        <div style="color: #aaa">측정을 시작하려면 세대 바닥을 누르세요.</div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
